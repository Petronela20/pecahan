<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dapur Pecahan: Game Chef Cilik</title>
<style>
:root{--wood:#7B4A2A;--wood2:#5A341C;--cream:#FFF4DC;--card:#FFFFFF;--ink:#3B2314;--bg:#FFE9C2;--yel:#FFC93C;--red:#D93A2B;--grn:#4E9B3E;--blu:#3A7CA5;--chk:rgba(217,58,43,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A1B12;--card:#4A3220;--cream:#3A2718;--ink:#FFF4DC;--chk:rgba(217,58,43,.22)}}
:root[data-theme="dark"]{--bg:#2A1B12;--card:#4A3220;--cream:#3A2718;--ink:#FFF4DC;--chk:rgba(217,58,43,.22)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--wood2);font-family:Arial,Helvetica,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:50%;top:50%;width:450px;height:800px;transform-origin:center;background:#8FD0F2;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px var(--wood)}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#app{position:absolute;inset:0;padding:14px 16px 24px;overflow-y:auto}
h1,h2{margin:0}
.sign{background:var(--wood);color:#FFF4DC;border:4px solid var(--wood2);border-radius:26px;padding:18px 12px 20px;text-align:center;box-shadow:0 5px 0 var(--wood2)}
.sign h1{font-size:clamp(40px,13vw,60px);line-height:.95;color:var(--yel);text-shadow:0 3px 0 var(--wood2);letter-spacing:.5px}
.sign small{display:block;font-size:14px;font-weight:700;margin-bottom:8px;color:#FFF4DC}
.chef{font-size:64px;text-align:center;margin:10px 0 0;line-height:1}
.say{background:var(--card);border:3px solid var(--wood);border-radius:20px;padding:12px 14px;font-size:16px;line-height:1.4;margin:12px 0}
.btn{display:block;width:100%;font:700 20px Arial,sans-serif;color:#fff;background:var(--red);border:3px solid var(--wood2);border-radius:999px;padding:13px 16px;margin:10px 0;cursor:pointer;box-shadow:0 4px 0 var(--wood2);touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood2)}
.btn:focus-visible,.cd:focus-visible,.slot:focus-visible{outline:4px solid var(--blu);outline-offset:2px}
.btn.alt{background:var(--blu)}.btn.grn{background:var(--grn)}
.btn.big{font-size:24px;padding:15px}
.row{display:flex;gap:10px;align-items:center;justify-content:center}
.row .btn{margin:10px 0}
.hud{display:flex;align-items:center;gap:10px;background:var(--wood);color:#FFF4DC;border:3px solid var(--wood2);border-radius:999px;padding:6px 12px 6px 6px;font-size:15px}
.hud b{flex:1}.pt{background:var(--cream);color:var(--ink);border-radius:999px;padding:4px 10px;font-weight:700}
.ic{border:0;background:var(--cream);border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}
.bar{height:10px;background:var(--cream);border:2px solid var(--wood);border-radius:9px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yel);transition:width .4s}
.card{background:var(--card);border:3px solid var(--wood);border-radius:22px;padding:14px;margin:10px 0;text-align:center}
.ord{font-size:18px;font-weight:700;margin:0 0 10px;line-height:1.35}
.tip{font-size:15px;text-align:center;margin:8px 0;background:var(--cream);border:2px solid var(--wood);border-radius:14px;padding:6px 10px}
.ctr{text-align:center}.ctr small{display:block;font-size:13px;margin-top:2px}
.eq{font-size:30px;color:var(--wood)}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-weight:700;line-height:1.15;vertical-align:middle;margin:0 2px}
.fr i{font-style:normal;padding:0 4px;min-width:1.1em;text-align:center}
.fr i:first-child{border-bottom:2.5px solid currentColor}
.sl{cursor:pointer}.sl:hover{filter:brightness(1.08)}
.cells{display:flex;border:3px solid var(--wood);border-radius:8px;overflow:hidden;height:36px;margin:6px 0 4px}
.cells span{flex:1;border-right:2px solid #fff}.cells span:last-child{border-right:0}
.lab{font-size:22px;margin-bottom:6px}
.sgn{font-size:34px;font-weight:700;color:var(--red);margin:4px 0}
.sg{font-size:38px;padding:8px 0}
.slots{display:flex;gap:8px;margin:10px 0}
.slot{flex:1;min-height:76px;border:3px dashed var(--wood);border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--cream);font-size:13px}
.pool{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:76px;padding:6px;border-radius:16px}
.cd{background:var(--yel);color:#3B2314;border:3px solid var(--wood2);border-radius:14px;min-width:78px;padding:8px 6px;font-size:22px;cursor:grab;touch-action:none;user-select:none;box-shadow:0 3px 0 var(--wood2)}
.cd.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:30;opacity:.92}
.ends{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--wood);margin-top:-4px}
.ov{position:absolute;inset:0;background:rgba(40,20,8,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{width:100%;max-width:400px;background:var(--cream);border:5px solid var(--wood);border-radius:28px;padding:18px;text-align:center;animation:pop .28s ease-out}
.md.ok{border-color:var(--grn)}.md.no{border-color:var(--red)}
.md h2{font-size:32px;color:var(--wood)}.md.ok h2{color:var(--grn)}.md.no h2{color:var(--red)}
.mb{font-size:17px;line-height:1.45;margin:8px 0 4px}.mb small{font-size:15px;display:block;margin-top:8px}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.lv{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:3px solid var(--wood);border-radius:20px;padding:12px;margin:12px 0;width:100%;font:inherit;color:inherit;cursor:pointer;box-shadow:0 4px 0 var(--wood2)}
.lv .em{font-size:40px;width:56px;text-align:center}.lv b{font-size:18px}.lv span{display:block;font-size:14px;margin-top:2px}
.stars{font-size:46px;letter-spacing:4px}
.info p{margin:6px 0;font-size:16px;line-height:1.45;text-align:left}
.story{display:flex;gap:10px;align-items:flex-start;margin:12px 0}.av{font-size:40px;background:var(--cream);border:3px solid var(--wood);border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;flex:none}
@media (prefers-reduced-motion:reduce){.md{animation:none}.bar i{transition:none}}
</style></head>

<script>
const $=s=>document.querySelector(s),app=$('#app'),stage=$('#stage');
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/450,innerHeight/800)})`}
addEventListener('resize',fit);fit();
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const val=f=>f[0]/f[1];
const fr=(a,b)=>`<span class="fr"><i>${a}</i><i>${b}</i></span>`;
let best={};try{best=JSON.parse(localStorage.getItem('dapurpecahan')||'{}')}catch(e){}
let L=0,qi=0,score=0,tries=0,Q=null,qs=[];
const show=h=>{app.innerHTML=h;app.scrollTop=0};
let mute=false,AC=null;
function snd(k){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime;
 const S={ok:[[523,0],[659,.12],[784,.24]],win:[[523,0],[659,.12],[784,.24],[1047,.4]],no:[[240,0],[170,.17]],tap:[[640,0]]}[k];
 S.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=k==='no'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,n+t);g.gain.exponentialRampToValueAtTime(k==='tap'?.12:.25,n+t+.02);g.gain.exponentialRampToValueAtTime(.0001,n+t+.22);o.connect(g);g.connect(AC.destination);o.start(n+t);o.stop(n+t+.25)})}catch(e){}}

function pie(n,f,size,tap,col){col=col||'#F5B83D';
 let h=`<svg viewBox="-52 -52 104 104" width="${size}" height="${size}" role="img" aria-label="pizza ${n} potong"><circle r="50" fill="#D9984A" stroke="#7B4A2A" stroke-width="2"/>`;
 for(let i=0;i<n;i++){const on=typeof f==='number'?i<f:f.has(i);
  const a0=-Math.PI/2+i*2*Math.PI/n,a1=-Math.PI/2+(i+1)*2*Math.PI/n,am=(a0+a1)/2;
  const p=n==1?'<circle r="46" ':`<path d="M0 0L${(46*Math.cos(a0)).toFixed(2)} ${(46*Math.sin(a0)).toFixed(2)}A46 46 0 0 1 ${(46*Math.cos(a1)).toFixed(2)} ${(46*Math.sin(a1)).toFixed(2)}Z" `;
  h+=p+`fill="${on?col:'#F3E9D6'}" stroke="#fff" stroke-width="1.6" ${tap?`data-i="${i}" class="sl"`:''}/>`;
  if(on&&n>1)h+=`<circle cx="${(28*Math.cos(am)).toFixed(1)}" cy="${(28*Math.sin(am)).toFixed(1)}" r="${n>8?2.4:3.6}" fill="#D93A2B" pointer-events="none"/>`;}
 return h+'</svg>';}
const bar=(n,k,col)=>`<div class="cells" aria-label="${k} dari ${n} bagian">${Array.from({length:n},(_,i)=>`<span style="background:${i<k?col:'#F3E9D6'}"></span>`).join('')}</div>`;

function hud(){return `<div class="hud"><button class="ic" onclick="menu()" aria-label="Menu">🏠</button><b>Level ${L+1} · Soal ${qi+1} dari 5</b><button class="ic" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'" aria-label="Suara">${mute?'🔇':'🔊'}</button><span class="pt">⭐ ${score}</span></div><div class="bar"><i style="width:${qi*20}%"></i></div>`}
function modal(ok,title,body,btn,act){const d=document.createElement('div');d.className='ov';
 d.innerHTML=`<div class="md ${ok?'ok':'no'}" role="dialog"><div class="chef">${ok?'👩‍🍳':'🙈'}</div><h2>${title}</h2><div class="mb">${body}</div><button class="btn big ${ok?'grn':''}" id="mb">${btn}</button></div>`;
 stage.appendChild(d);snd(ok?'ok':'no');const b=d.querySelector('#mb');b.focus();b.onclick=()=>{d.remove();act()};}
function judge(ok,okBody,hint,ans){
 if(ok){score+=tries?10:20;modal(true,'Hebat!','Jawabanmu benar!<br>'+okBody,'Lanjut',()=>{qi++;next()});return;}
 tries++;
 if(tries>=2)modal(false,'Ups, hampir!','Jawaban yang tepat:<br>'+ans+'<small>'+hint+'</small>','Lanjut',()=>{qi++;next()});
 else modal(false,'Ups! Coba lagi, ya!',hint,'Coba lagi',()=>{});}
function next(){if(qi>=5)return result();tries=0;Q=qs[qi];[q1,q2,q3][L]();}

/* ---------- Level 1: pecahan senilai (ketuk potongan) ---------- */
const CUST=[['Bu Sari','👩','Aku sedang arisan dan butuh'],['Pak Budi','👨','Anakku berulang tahun hari ini, aku pesan'],['Dina','👧','Aku mau berbagi dengan teman, tolong siapkan'],['Kakek Joko','👴','Cucuku datang berkunjung, tolong buatkan'],['Rafi','👦','Aku lapar sepulang sekolah, aku mau'],['Ayu','👩‍🎓','Untuk bekal piknik kelas, tolong siapkan']];
let cc=Math.floor(Math.random()*6);
function gen1(){const [a,b]=rnd([[1,2],[2,3],[3,4],[1,3],[2,5],[3,5],[1,4],[5,6]]);const m=rnd([2,3].filter(m=>b*m<=12));return{a,b,m,n:b*m,k:a*m,c:CUST[(cc++)%6]}}
function q1(){const {a,b,m,n,k,c}=Q;let sel=new Set();
 const draw=()=>{show(hud()+`<div class="story"><div class="av">${c[1]}</div><div class="say" style="margin:0"><b>${c[0]}</b><br>${c[2]} pizza ${fr(a,b)}. Pizza di dapur sudah dipotong ${n} bagian sama besar. Tolong ambilkan potongan yang tepat, ya Chef!</div></div><div class="card"><p class="ord">Pesanan: pizza ${fr(a,b)}</p>
 <div class="row"><div class="ctr">${pie(b,a,104)}<small>Pesanan</small></div><b class="eq">=</b><div class="ctr">${pie(n,sel,172,1)}<small>Pizzamu</small></div></div>
 <p>Terisi ${sel.size} dari ${n}: ${fr(sel.size,n)}</p></div>
 <p class="tip">Ketuk potongan pizza sampai nilainya sama dengan pesanan.</p>
 <div class="row"><button class="btn alt" id="rs">Ulangi</button><button class="btn" id="ck">Periksa</button></div>`);
  document.querySelectorAll('.sl').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);snd('tap');draw()});
  $('#rs').onclick=()=>{sel=new Set();draw()};
  $('#ck').onclick=()=>{const ok=sel.size*b===a*n;
   judge(ok,`${fr(k,n)} = ${fr(a,b)}<small>${c[0]}: “Pas sekali, terima kasih, Chef!”</small>`,`${c[0]}: “Hmm, kok belum pas ya?” `+(sel.size*b<a*n?'Potongannya masih kurang. ':'Potongannya terlalu banyak. ')+`Kalikan pembilang dan penyebut dengan ${m}: ${a}/${b} = (${a}×${m})/(${b}×${m}) = ${k}/${n}.`,`${fr(k,n)} = ${fr(a,b)}`)};};
 draw();}

/* ---------- Level 2: membandingkan ---------- */
function gen2(){if(Math.random()<.5){const [a,b]=shuf([2,3,4,5,6,7,8,9,10]);return{kind:'u',x:[1,a],y:[1,b]}}
 const d=rnd([5,6,7,8,9,10,11,12]),[c,e]=shuf(Array.from({length:d-1},(_,i)=>i+1));return{kind:'s',x:[c,d],y:[e,d]}}
function q2(){const {x,y,kind}=Q;const cmp=Math.sign(x[0]*y[1]-y[0]*x[1]);const S=['&lt;','=','&gt;'],T=['<','=','>'];
 show(hud()+`<div class="card"><p class="ord">Mana tanda yang tepat?</p>${bar(x[1],x[0],'#F5B83D')}<div class="lab">${fr(x[0],x[1])}</div><div class="sgn">?</div>${bar(y[1],y[0],'#F7A8B8')}<div class="lab">${fr(y[0],y[1])}</div></div>
 <div class="row">${S.map((s,i)=>`<button class="btn sg" data-i="${i}" aria-label="${['lebih kecil','sama dengan','lebih besar'][i]}">${s}</button>`).join('')}</div>`);
 document.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ans=`${fr(x[0],x[1])} ${T[cmp+1].replace('<','&lt;').replace('>','&gt;')} ${fr(y[0],y[1])}`;
  const hint=kind=='u'?'Pembilangnya sama-sama 1. Makin besar penyebut, makin kecil potongannya. Jadi 1/'+Math.max(x[1],y[1])+' adalah yang lebih kecil.':`Penyebutnya sama (${x[1]}), jadi potongannya sama besar. Bandingkan pembilangnya: ${x[0]} dan ${y[0]}.`;
  judge(i-1===cmp,ans,hint,ans)});}

/* ---------- Level 3: mengurutkan (seret kartu) ---------- */
function gen3(){let items;if(Math.random()<.5)items=shuf([2,3,4,5,6,7,8,9]).slice(0,3).map(d=>[1,d]);
 else{const d=rnd([6,7,8,9,10,12]);items=shuf(Array.from({length:d-1},(_,i)=>i+1)).slice(0,3).map(c=>[c,d])}
 return{items:shuf(items),asc:Math.random()<.6,slots:[null,null,null]}}
function q3(){const I=Q.items,asc=Q.asc,slots=Q.slots=[null,null,null];
 const put=(id,s)=>{const o=slots.indexOf(id);if(o>-1)slots[o]=null;if(slots[s]!==null&&o>-1)slots[o]=slots[s];slots[s]=id;draw()};
 const out=id=>{const o=slots.indexOf(id);if(o>-1)slots[o]=null;draw()};
 const tap=id=>{if(slots.includes(id))out(id);else{const e=slots.indexOf(null);if(e>-1)put(id,e)}};
 const card=id=>`<div class="cd" tabindex="0" role="button" data-id="${id}" aria-label="${I[id][0]} per ${I[id][1]}">${fr(I[id][0],I[id][1])}</div>`;
 const draw=()=>{show(hud()+`<div class="card"><p class="ord">Urutkan pecahan dari yang ${asc?'terkecil ke terbesar':'terbesar ke terkecil'}!</p>
 <div class="slots">${slots.map((c,s)=>`<div class="slot" data-s="${s}">${c===null?s+1:card(c)}</div>`).join('')}</div>
 <div class="ends"><span>${asc?'terkecil':'terbesar'}</span><span>${asc?'terbesar':'terkecil'}</span></div></div>
 <p class="tip">Seret kartu ke kotak jawaban, atau ketuk kartu.</p>
 <div class="pool" id="pool">${I.map((_,id)=>slots.includes(id)?'':card(id)).join('')}</div>
 <div class="row"><button class="btn alt" id="rs">Ulangi</button><button class="btn" id="ck">Periksa</button></div>`);
  document.querySelectorAll('.cd').forEach(el=>{const id=+el.dataset.id;
   el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(id)}};
   el.onpointerdown=e=>{const sx=e.clientX,sy=e.clientY;let g=null,moved=false;el.setPointerCapture(e.pointerId);
    el.onpointermove=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>7){moved=true;g=el.cloneNode(true);g.className='cd ghost';document.body.appendChild(g);el.style.opacity=.3}
     if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'}};
    el.onpointerup=ev=>{el.onpointermove=el.onpointerup=null;if(g)g.remove();
     if(!moved){tap(id);return}
     const t=document.elementFromPoint(ev.clientX,ev.clientY),sl=t&&t.closest('.slot');
     if(sl)put(id,+sl.dataset.s);else if(t&&t.closest('#pool'))out(id);else draw()};};});
  $('#rs').onclick=()=>{slots.fill(null);draw()};
  $('#ck').onclick=()=>{if(slots.includes(null)){modal(false,'Belum lengkap','Isi ketiga kotak jawaban dulu, ya.','Oke',()=>{});return}
   const want=I.map((f,i)=>i).sort((p,q)=>(val(I[p])-val(I[q]))*(asc?1:-1));
   const ok=slots.every((c,s)=>c===want[s]);const txt=want.map(i=>fr(I[i][0],I[i][1])).join(asc?' &lt; ':' &gt; ');
   const same=I[0][1]===I[1][1]&&I[1][1]===I[2][1];
   judge(ok,txt,same?'Penyebutnya sama, jadi urutkan pembilangnya saja.':'Pembilangnya 1. Makin besar penyebut, makin kecil nilainya.',txt)};};
 draw();}

 <button class="btn big" onclick="menu()">Mulai</button><button class="btn alt" onclick="info()">Ringkasan materi</button>`)}

 show(`<div class="sign"><small>Petualangan Pecahan Senilai</small><h1 style="font-size:40px">Dapur Pecahan</h1></div><p class="tip"><b>Pilih levelmu, Chef Cilik!</b></p>`+LV.map((l,i)=>`<button class="lv" onclick="start(${i})"><span class="em">${l[0]}</span><div><b>Level ${i+1}: ${l[1]}</b><span>${l[2]}</span><span>${star(best[i])}</span></div></button>`).join('')+
 `<button class="btn alt" onclick="info()">Ringkasan materi</button>`)}
function start(l){L=l;qi=0;score=0;qs=Array.from({length:5},()=>[gen1,gen2,gen3][l]());next()}
function result(){const st=score>=80?3:score>=50?2:score>=20?1:0;snd(st>1?'win':'ok');if((best[L]||0)<st)best[L]=st;try{localStorage.setItem('dapurpecahan',JSON.stringify(best))}catch(e){}
 show(`<div class="sign"><h1 style="font-size:38px">Selesai!</h1></div><div class="card"><div class="chef">${st>1?'🎉':'💪'}</div><div class="stars" aria-label="${st} bintang">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>
 <p class="ord">Skormu: ${score} dari 100</p><p class="tip">${st==3?'Luar biasa, Master Chef Pecahan!':st==2?'Bagus sekali! Sedikit lagi sempurna.':'Ayo coba lagi, kamu pasti bisa!'}</p></div>
 <button class="btn big" onclick="start(${L})">Main lagi</button>${L<2?`<button class="btn grn" onclick="start(${L+1})">Level berikutnya</button>`:''}<button class="btn alt" onclick="menu()">Pilih level</button>`)}
function info(){show(`<div class="sign"><h1 style="font-size:34px">Ringkasan Materi</h1></div><div class="card info">
 <p><b>Pecahan senilai</b><br>Kalikan atau bagi pembilang dan penyebut dengan bilangan yang sama. ${fr(1,2)} = ${fr(2,4)} = ${fr(3,6)}</p>
 <p><b>Pembilang 1</b><br>Makin besar penyebut, makin kecil nilainya. ${fr(1,2)} &gt; ${fr(1,4)} &gt; ${fr(1,8)}</p>
 <p><b>Penyebut sama</b><br>Bandingkan pembilangnya. ${fr(3,8)} &lt; ${fr(5,8)}</p>
 <p><b>Mengurutkan</b><br>Terkecil ke terbesar berarti dari nilai paling kecil di kiri.</p></div><button class="btn alt" onclick="menu()">Kembali</button>`)}
menu();
